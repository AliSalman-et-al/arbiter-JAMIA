project:
  type: default
  render:
    - manuscript.qmd
    - results.qmd
    - supplement.qmd
engine: knitr
knitr:
  opts_chunk:
    results: asis
format:
  html:
    include-before-body: ../scripts/publication-nav.html
    toc: true
    embed-resources: true
execute:
  echo: false
  warning: false
  message: false
  cache: false
