<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:var(--font-sans,Arial,sans-serif);color:var(--foreground,#20252b);margin:0;line-height:1.45}p{margin:0 0 12px}.eyebrow{font-size:12px;color:var(--muted-foreground,#626b73)}figure{margin:0}img{display:block;width:100%;height:auto;background:white}figcaption{font-size:12px;color:var(--muted-foreground,#626b73);margin-top:10px}button{font:inherit;font-size:12px;border:1px solid var(--border,#cbd0d5);padding:6px 10px;border-radius:5px;background:var(--background,white);color:var(--foreground,#20252b);cursor:pointer}button[aria-pressed=true]{background:var(--foreground,#20252b);color:var(--background,white)}nav{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 8px}#reading{font-size:13px;min-height:58px}strong{font-weight:650}
</style></head><body>
<p class="eyebrow">FIGURE 4 · EDITORIAL PROTOTYPE · FINALIZED BENCHMARK DATA</p>
<figure><img src="C:/Users/Ali-Salman/Documents/Analysis/arbiter-JAMIA/docs/rethink-2026-10-22/second-review/figure4-prototype.png" alt="Absolute exact agreement and paired differences against each expert. ARBITER has greater pooled agreement against both experts. D5 has the largest domain gains. D3 absolute agreement differs substantially between experts. The Published-label contrast is minus 1.8 percentage points, with its interval spanning zero.">
<figcaption>Each domain: 102 trial ratings. Pooled: 510 domain cells. Lines: 95% percentile intervals from 10,000 trial resamples within 16 fixed reviews, preserving paired arms and all ratings from each sampled trial. This is a layout prototype, not a rebuilt manuscript figure.</figcaption></figure>
<nav aria-label="Interpret the figure"><button aria-pressed="true" data-note="pooled">Pooled result</button><button aria-pressed="false" data-note="d3">D3: uncertainty</button><button aria-pressed="false" data-note="d5">D5: largest gain</button><button aria-pressed="false" data-note="reference">Reference context</button></nav>
<p id="reading" aria-live="polite"></p>
<script>
const notes={pooled:'<strong>The gain and its starting point are visible together.</strong> Expert 1: 371 versus 332 matches; Expert 2: 433 versus 400, each out of 510. The paired gains are 39 and 33 additional matching ratings. These are agreement comparisons, not accuracy against known truth.',d3:'<strong>D3 remains difficult and reference-dependent.</strong> ARBITER matches 43/102 ratings from Expert 1 and 80/102 from Expert 2. The two experts agree with each other on 54/102 D3 ratings. A pooled improvement alone would hide this difference.',d5:'<strong>D5 has the largest observed domain gains.</strong> Expert 1: 75 versus 55 matches; Expert 2: 84 versus 72, each out of 102. This identifies a useful diagnostic focus; it does not isolate which workflow component produced the gain.',reference:'<strong>Expert agreement is context, not a ceiling.</strong> The experts match on 388/510 cells (76.1%). The Published-label comparison uses all 510 cells and is a separate reference comparison. Its different pattern does not establish that published labels are wrong.'};
function show(k){document.getElementById('reading').innerHTML=notes[k];document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.note===k)))}document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.note)));show('pooled');console.log('Figure prototype: four interpretation tabs; no external dependencies.');
</script></body></html>
